# sCare 自动部署流水线
# 触发条件：master 分支 push（含 merge）
# 流程：构建前端 → 同步到服务器 → 执行迁移 → Docker Compose 部署

name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:  # 手动触发

# 同一时间只允许一个部署，新的会取消旧的
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  DEPLOY_DIR: /opt/scare
  NODE_VERSION: '20'

jobs:
  # ============================================
  # 阶段 1：构建前端产物
  # ============================================
  build-frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/**/package-lock.json'

      # C 端构建
      - name: 安装 C 端依赖
        working-directory: frontend/c-end
        run: npm ci

      - name: 构建 C 端
        working-directory: frontend/c-end
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

      # B 端管理门户构建
      - name: 安装管理门户依赖
        working-directory: frontend/management-portal
        run: npm ci

      - name: 构建管理门户
        working-directory: frontend/management-portal
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_AMAP_KEY: ${{ secrets.AMAP_KEY }}

      # 上传构建产物
      - name: 上传 C 端产物
        uses: actions/upload-artifact@v4
        with:
          name: c-end-dist
          path: frontend/c-end/dist/
          retention-days: 1

      - name: 上传管理门户产物
        uses: actions/upload-artifact@v4
        with:
          name: management-portal-dist
          path: frontend/management-portal/dist/
          retention-days: 1

  # ============================================
  # 阶段 2：部署到服务器
  # ============================================
  deploy:
    name: 部署到服务器
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验部署 Secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=0
          for key in SERVER_HOST SERVER_USER SERVER_SSH_KEY DB_ROOT_PASSWORD DB_PASSWORD REDIS_PASSWORD JWT_SECRET; do
            if [ -z "${!key}" ]; then
              echo "❌ 缺少必填 GitHub Secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "请先在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中补齐以上 Secret。"
            exit 1
          fi

      # 下载前端构建产物
      - name: 下载 C 端产物
        uses: actions/download-artifact@v4
        with:
          name: c-end-dist
          path: deployment/dist/c-end/

      - name: 下载管理门户产物
        uses: actions/download-artifact@v4
        with:
          name: management-portal-dist
          path: deployment/dist/management-portal/

      # 配置 SSH
      - name: 配置 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 生成 SSH 连接参数
        run: |
          echo "SSH_OPTS=-i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || 22 }} -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 -o PreferredAuthentications=publickey -o PubkeyAuthentication=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o StrictHostKeyChecking=yes" >> $GITHUB_ENV
          echo "SSH_TARGET=${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" >> $GITHUB_ENV
          echo "SSH_RETRY_ATTEMPTS=5" >> $GITHUB_ENV
          echo "SSH_RETRY_DELAY_SECONDS=5" >> $GITHUB_ENV

      - name: SSH 连接探活
        run: |
          set -euo pipefail
          for i in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            echo "SSH 连接探活 ($i/$SSH_RETRY_ATTEMPTS)"
            if ssh $SSH_OPTS "$SSH_TARGET" "echo ssh-ok"; then
              exit 0
            fi

            status=$?
            echo "本次 SSH 连接失败，exit code: $status"

            if [ "$i" -lt "$SSH_RETRY_ATTEMPTS" ]; then
              sleep $((SSH_RETRY_DELAY_SECONDS * i))
              continue
            fi

            echo "最后一次执行详细 SSH 诊断..."
            ssh -vvv $SSH_OPTS "$SSH_TARGET" "true" || true
            echo "❌ SSH 探活失败，请检查服务器防火墙、sshd MaxStartups、部署账号与公钥配置。"
            exit "$status"
          done

      - name: 初始化服务器部署目录
        run: |
          set -euo pipefail
          for i in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            echo "初始化服务器部署目录 ($i/$SSH_RETRY_ATTEMPTS)"
            if ssh $SSH_OPTS "$SSH_TARGET" "mkdir -p '${{ env.DEPLOY_DIR }}/deployment'"; then
              exit 0
            fi

            status=$?
            echo "目录初始化失败，exit code: $status"

            if [ "$i" -lt "$SSH_RETRY_ATTEMPTS" ]; then
              sleep $((SSH_RETRY_DELAY_SECONDS * i))
              continue
            fi

            exit "$status"
          done

      - name: 写入服务器部署配置
        run: |
          set -euo pipefail
          for i in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            echo "写入服务器部署配置 ($i/$SSH_RETRY_ATTEMPTS)"
            if ssh $SSH_OPTS "$SSH_TARGET" "cat > '${{ env.DEPLOY_DIR }}/deployment/.env' <<'EOF'
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME || 'scare_db' }}
          DB_USER=${{ secrets.DB_USER || 'scare_user' }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_PORT=${{ secrets.DB_PORT || '3306' }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}
          BACKEND_PORT=${{ secrets.BACKEND_PORT || '8080' }}
          NGINX_PORT=${{ secrets.NGINX_PORT || '80' }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          AMAP_KEY=${{ secrets.AMAP_KEY }}
          EOF"; then
              exit 0
            fi

            status=$?
            echo "写入部署配置失败，exit code: $status"

            if [ "$i" -lt "$SSH_RETRY_ATTEMPTS" ]; then
              sleep $((SSH_RETRY_DELAY_SECONDS * i))
              continue
            fi

            exit "$status"
          done

      # 同步项目文件到服务器
      - name: 同步文件到服务器
        run: |
          set -euo pipefail
          for i in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            echo "同步文件到服务器 ($i/$SSH_RETRY_ATTEMPTS)"
            if rsync -azP --delete --ignore-errors \
              --exclude='/.git' \
              --exclude='node_modules' \
              --exclude='/frontend/*/dist' \
              --exclude='/.env' \
              --exclude='/deployment/.env' \
              --exclude='/paper/' \
              --exclude='/database/' \
              -e "ssh $SSH_OPTS" \
              ./ "${SSH_TARGET}:${{ env.DEPLOY_DIR }}/"; then
              exit 0
            fi

            status=$?
            echo "文件同步失败，exit code: $status"

            if [ "$i" -lt "$SSH_RETRY_ATTEMPTS" ]; then
              sleep $((SSH_RETRY_DELAY_SECONDS * i))
              continue
            fi

            exit "$status"
          done

      # 在服务器上执行部署（包含迁移）
      - name: 执行部署与迁移
        run: |
          set -euo pipefail
          for i in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            echo "执行部署与迁移 ($i/$SSH_RETRY_ATTEMPTS)"
            if ssh $SSH_OPTS "$SSH_TARGET" "mkdir -p '${{ env.DEPLOY_DIR }}' && cd '${{ env.DEPLOY_DIR }}' && bash deployment/server-deploy.sh"; then
              exit 0
            fi

            status=$?
            echo "执行部署失败，exit code: $status"

            if [ "$i" -lt "$SSH_RETRY_ATTEMPTS" ]; then
              sleep $((SSH_RETRY_DELAY_SECONDS * i))
              continue
            fi

            exit "$status"
          done

      # 健康检查
      - name: 健康检查
        run: |
          echo "等待服务启动..."
          sleep 15
          for i in $(seq 1 10); do
            if ssh $SSH_OPTS "$SSH_TARGET" "curl -sf http://localhost:8080/api/v1/health > /dev/null 2>&1"; then
              echo "✅ 服务启动成功"
              exit 0
            fi
            echo "等待中... ($i/10)"
            sleep 5
          done
          echo "❌ 健康检查失败"
          exit 1

      # 清理
      - name: 清理 SSH 密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key
