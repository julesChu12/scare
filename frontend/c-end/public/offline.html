<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#409EFF" />
  <title>离线 - sCare 社区养老服务</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .offline-container {
      text-align: center;
      max-width: 360px;
    }
    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #409EFF 0%, #66b1ff 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .offline-icon svg {
      width: 56px;
      height: 56px;
      fill: #fff;
    }
    h1 {
      font-size: 22px;
      color: #303133;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #909399;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .retry-btn {
      display: inline-block;
      padding: 12px 40px;
      background: #409EFF;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:active {
      background: #3a8ee6;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <!-- 断网图标 -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 8.98C20.93 5.9 16.69 4 12 4C10.13 4 8.33 4.33 6.67 4.92L8.18 6.43C9.37 6.16 10.67 6 12 6C15.87 6 19.42 7.58 22 10.02L24 8.98ZM1 1.27L4.93 5.2C2.27 6.82 0 9.04 0 9L2 10C3.1 8.9 6.24 6.39 8.57 5.57L10.09 7.09C7.37 7.69 5.81 8.63 4.68 9.55L6.68 11.55C7.56 10.83 9.39 9.72 12 9.72C12.93 9.72 13.78 9.88 14.55 10.12L16.41 11.98C16.28 11.98 16.14 12 16 12L12 16L15.06 19.06L22.73 26.73L24 25.46L2.27 3.73L1 1.27ZM12 16C10.9 16 10 16.9 10 18C10 19.1 10.9 20 12 20C13.1 20 14 19.1 14 18C14 16.9 13.1 16 12 16Z"/>
      </svg>
    </div>
    <h1>当前无法连接网络</h1>
    <p>请检查您的网络连接后重试。<br>部分已缓存的内容仍可正常使用。</p>
    <button class="retry-btn" onclick="location.reload()">重新连接</button>
  </div>
</body>
</html>
