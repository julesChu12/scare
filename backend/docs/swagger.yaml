  /c/auth/quick-start:
    post:
      consumes:
      - application/json
      description: 一次性完成注册、登录和创建服务需求的全流程
      parameters:
      - description: 快速开通请求
        in: body
        name: request
        required: true
        schema:
          properties:
            address:
              type: string
            code:
              type: string
            contact_name:
              type: string
            contact_phone:
              type: string
            description:
              type: string
            images:
              items:
                type: string
              type: array
            latitude:
              format: float64
              type: number
            longitude:
              format: float64
              type: number
            name:
              type: string
            phone:
              type: string
            service_type:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 快速开通成功
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/handler.APIResponse'
