          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: 需求不存在
          schema:
            $ref: '#/definitions/handler.APIResponse'
