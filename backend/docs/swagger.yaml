basePath: /api/v1
definitions:
  geo.Point:
    properties:
      lat:
        description: 纬度
        type: number
      lng:
        description: 经度
        type: number
    type: object
  handler.APIResponse:
    properties:
      data: {}
      msg:
        example: ok
        type: string
    type: object
  handler.BatchUpdateSortRequest:
    properties:
      updates:
        items:
          properties:
            id:
              type: integer
            sort:
              type: integer
          required:
          - id
          type: object
        type: array
    required:
    - updates
    type: object
  handler.CreateMenuRequest:
    properties:
      component:
        type: string
      hidden:
        type: boolean
      icon:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      permission_code:
        type: string
      sort:
        type: integer
      status:
        type: string
    required:
    - name
    type: object
  handler.RequestResponse:
    properties:
      address:
        example: 北京市朝阳区幸福小区1号楼
        type: string
      appointment_time:
        type: string
      contact_name:
        example: 张大爷
        type: string
      contact_phone:
        example: "13800000008"
        type: string
      created_at:
        type: string
      description:
        example: 需要午餐送餐
        type: string
      feedback:
        type: string
      id:
        example: 1
        type: integer
      images:
        type: string
      rating:
        example: 5
        type: integer
      reject_reason:
        type: string
      request_no:
        example: REQ20260209001
        type: string
      service_type:
        example: meal
        type: string
      station_id:
        example: 1
        type: integer
      station_name:
        example: 朝阳区幸福街道服务站
        type: string
      status:
        example: dispatched
        type: string
      updated_at:
        type: string
      urgency:
        example: normal
        type: string
      user_id:
        example: 8
        type: integer
    type: object
  handler.Response:
    properties:
      data: {}
      msg:
        type: string
    type: object
  handler.UpdateMenuRequest:
    properties:
      component:
        type: string
      hidden:
        type: boolean
      icon:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      permission_code:
        type: string
      sort:
        type: integer
      status:
        type: string
    required:
    - name
    type: object
  handler.UserListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.UserResponse'
        type: array
      total:
        example: 100
        type: integer
    type: object
  handler.UserResponse:
    properties:
      age:
        example: 36
        type: integer
      avatar:
        example: https://example.com/avatar.jpg
        type: string
      b_end_identities:
        example:
        - staff
        - station_manager
        items:
          type: string
        type: array
      birth_date:
        example: "1990-01-01"
        type: string
      c_end_identities:
        example:
        - elderly
        items:
          type: string
        type: array
      created_at:
        type: string
      email:
        example: zhangsan@example.com
        type: string
      gender:
        example: male
        type: string
      id:
        example: 1
        type: integer
      id_card_hash:
        example: 2f0ab5...
        type: string
      id_card_masked:
        example: 1101**********1234
        type: string
      id_card_token:
        example: eyJ1aWQiOjF9.xxx
        type: string
      name:
        example: 张三
        type: string
      phone:
        example: "13800000001"
        type: string
      primary_identity:
        example: staff
        type: string
      station_id:
        example: 1
        type: integer
      status:
        example: active
        type: string
      updated_at:
        type: string
    type: object
  handler.bLoginRequest:
    properties:
      password:
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  handler.bRefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.bannerRequest:
    properties:
      image_url:
        type: string
      link_type:
        type: string
      link_value:
        type: string
      sort:
        type: integer
      station_id:
        type: integer
      status:
        type: string
      title:
        type: string
    required:
    - image_url
    type: object
  handler.cLoginRequest:
    properties:
      code:
        type: string
      password:
        type: string
      phone:
        type: string
      type:
        description: '"password" or "code", default "code"'
        type: string
    required:
    - phone
    type: object
  handler.cRefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.customerCreateRequest:
    properties:
      address:
        type: string
      birth_date:
        type: string
      disability_level:
        type: string
      gender:
        type: string
      health_status:
        type: string
      id_card:
        type: string
      medical_history:
        type: string
      name:
        type: string
      phone:
        type: string
      special_needs:
        type: string
      station_id:
        type: integer
    required:
    - name
    - phone
    type: object
  handler.customerUpdateRequest:
    properties:
      address:
        type: string
      birth_date:
        type: string
      disability_level:
        type: string
      gender:
        type: string
      health_status:
        type: string
      id_card:
        type: string
      medical_history:
        type: string
      name:
        type: string
      special_needs:
        type: string
      station_id:
        type: integer
    type: object
  handler.generateReportRequest:
    properties:
      end_date:
        type: string
      format:
        enum:
        - xlsx
        - csv
        type: string
      preview:
        type: boolean
      start_date:
        type: string
      station_id:
        type: integer
      type:
        enum:
        - service
        - performance
        - request
        - station
        type: string
    required:
    - end_date
    - format
    - start_date
    - type
    type: object
  handler.newsRequest:
    properties:
      content:
        type: string
      cover_url:
        type: string
      station_id:
        type: integer
      status:
        type: string
      summary:
        type: string
      title:
        type: string
      type:
        type: string
    required:
    - title
    type: object
  handler.rateRequest:
    properties:
      feedback:
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - rating
    type: object
  handler.requestCreate:
    properties:
      address:
        type: string
      contact_name:
        type: string
      contact_phone:
        type: string
      images:
        items:
          type: string
        type: array
      lat:
        type: number
      lng:
        type: number
      request_no:
        type: string
      service_type:
        type: string
    required:
    - service_type
    type: object
  handler.stationRequest:
    properties:
      code:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      status:
        type: string
    required:
    - name
    type: object
  handler.taskCompleteRequest:
    properties:
      images:
        items:
          type: string
        type: array
    type: object
  handler.taskTransferRequest:
    properties:
      staff_id:
        type: integer
    required:
    - staff_id
    type: object
  handler.updateRequestBody:
    properties:
      address:
        type: string
      contact_name:
        type: string
      contact_phone:
        type: string
      description:
        type: string
      service_type:
        type: string
      urgency:
        type: string
    type: object
  handler.updateStatusRequest:
    properties:
      reject_reason:
        type: string
      status:
        type: string
    required:
    - status
    type: object
  handler.userCreateRequest:
    properties:
      email:
        type: string
      identity_type:
        description: 身份类型
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      station_id:
        type: integer
      status:
        type: string
    required:
    - identity_type
    - password
    - phone
    type: object
  handler.userUpdateRequest:
    properties:
      avatar:
        type: string
      birth_date:
        description: 格式：2006-01-02
        type: string
      email:
        type: string
      gender:
        type: string
      id_card:
        type: string
      id_card_hash:
        type: string
      id_card_token:
        type: string
      name:
        type: string
      password:
        type: string
      station_id:
        type: integer
      status:
        type: string
    type: object
  handler.zoneRequest:
    properties:
      name:
        type: string
      points:
        items:
          $ref: '#/definitions/geo.Point'
        type: array
      priority:
        type: integer
      station_id:
        type: integer
      status:
        type: string
    required:
    - name
    - points
    - station_id
    type: object
host: localhost:8080
info:
  contact: {}
  description: 昌平区霍营街道社区养老信息分发平台后端 API
  title: 霍营街道社区养老服务平台 API
  version: "1.0"
paths:
  /api/v1/b/news:
    post:
      consumes:
      - application/json
      description: 创建新的新闻/公告
      parameters:
      - description: 新闻信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.newsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: 创建新闻
      tags:
      - B端-新闻管理
  /api/v1/b/news/{id}:
    delete:
      consumes:
      - application/json
      description: 删除新闻（软删除）
      parameters:
      - description: 新闻ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: 删除新闻
      tags:
      - B端-新闻管理
    put:
      consumes:
      - application/json
      description: 更新新闻信息
      parameters:
      - description: 新闻ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新闻信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.newsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: 更新新闻
      tags:
      - B端-新闻管理
  /api/v1/c/news:
    get:
      consumes:
      - application/json
      description: 获取已发布的新闻列表（分页）
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 新闻类型(news/notice/activity)
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.APIResponse'
      summary: 获取新闻列表
      tags:
      - C端-新闻
  /api/v1/c/news/{id}:
    get:
      consumes:
      - application/json
      description: 获取单条新闻的详细内容
      parameters:
      - description: 新闻ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 获取新闻详情
      tags:
      - C端-新闻
  /b/auth/login:
    post:
      consumes:
      - application/json
      description: B端工作人员使用手机号和密码登录
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.bLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回token和用户信息
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: 用户已禁用或无B端角色
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/handler.APIResponse'
      summary: B端用户登录
      tags:
      - b_auth
  /b/auth/logout:
    post:
      consumes:
      - application/json
      description: 将当前访问令牌加入黑名单，使其失效
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - Bearer: []
      summary: 用户登出
      tags:
      - b_auth
      - c_auth
  /b/auth/me:
    get:
      consumes:
      - application/json
      description: 获取当前登录的B端用户详细信息及权限列表
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功，返回用户信息和权限
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: 无B端角色
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - Bearer: []
      summary: 获取当前B端用户信息
      tags:
      - b_auth
  /b/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用刷新令牌获取新的访问令牌
      parameters:
      - description: 刷新令牌请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.bRefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: 令牌无效或已过期
          schema:
            $ref: '#/definitions/handler.APIResponse'
      summary: 刷新访问令牌
      tags:
      - b_auth
  /b/banners:
    get:
      consumes:
      - application/json
      description: 分页获取轮播图列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 站点ID筛选
        in: query
        name: station_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - Bearer: []
      summary: 获取轮播图列表（管理端）
      tags:
      - b_banner
    post:
      consumes:
      - application/json
      description: 创建新的轮播图
      parameters:
      - description: 轮播图信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.bannerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - Bearer: []
      summary: 创建轮播图
      tags:
      - b_banner
  /b/banners/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定轮播图
      parameters:
      - description: 轮播图ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - Bearer: []
      summary: 删除轮播图
      tags:
      - b_banner
    put:
      consumes:
      - application/json
      description: 更新指定轮播图信息
      parameters:
      - description: 轮播图ID
        in: path
        name: id
        required: true
        type: integer
      - description: 轮播图信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.bannerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - Bearer: []
      summary: 更新轮播图
      tags:
      - b_banner
  /b/customers:
    get:
      description: 分页查询老年人档案，支持关键词/站点/健康状况筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 搜索关键词(姓名/手机号)
        in: query
        name: keyword
        type: string
      - description: 站点ID
        in: query
        name: station_id
        type: integer
      - description: 健康状况(good/normal/poor)
        in: query
        name: health_status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - Bearer: []
      summary: 获取老人档案列表
      tags:
      - b_customer
    post:
      consumes:
      - application/json
      description: B端为老人创建档案（同时创建用户账号和身份）
      parameters:
      - description: 老人信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.customerCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - Bearer: []
      summary: 创建老人档案
      tags:
      - b_customer
  /b/customers/{id}:
    get:
      description: 根据用户ID获取老年人档案详细信息
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - Bearer: []
      summary: 获取老人档案详情
      tags:
      - b_customer
    put:
      consumes:
      - application/json
      description: 更新老年人档案信息
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.customerUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - Bearer: []
      summary: 更新老人档案
      tags:
      - b_customer
  /b/customers/{id}/service-records:
    get:
      description: 获取指定老人的历史服务记录
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - Bearer: []
      summary: 获取老人服务记录
      tags:
      - b_customer
  /b/menus:
    get:
      consumes:
      - application/json
      description: 获取完整菜单树，用于菜单管理
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: 获取菜单树
      tags:
      - B端-菜单管理
    post:
      consumes:
      - application/json
      description: 创建新菜单
      parameters:
      - description: 菜单信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateMenuRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
