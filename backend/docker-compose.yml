services:
  mysql:
    image: mysql:8.0
    container_name: scare_mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-scare_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-scare_db}
      MYSQL_USER: ${DB_USER:-scare_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-scare_pass}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds/001_seed_permissions.sql:/docker-entrypoint-initdb.d/02-seed-permissions.sql
      - ./database/seeds/002_seed_users.sql:/docker-entrypoint-initdb.d/03-seed-users.sql
      - ./database/seeds/003_seed_stations.sql:/docker-entrypoint-initdb.d/04-seed-stations.sql
      - ./database/seeds/004_seed_requests.sql:/docker-entrypoint-initdb.d/05-seed-requests.sql
      - ./database/seeds/005_seed_notifications.sql:/docker-entrypoint-initdb.d/06-seed-notifications.sql
      - ./database/seeds/006_seed_news.sql:/docker-entrypoint-initdb.d/07-seed-news.sql
      - ./database/seeds/007_seed_menus.sql:/docker-entrypoint-initdb.d/08-seed-menus.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone='+08:00'
      --max_connections=500
      --innodb_buffer_pool_size=256M
    networks:
      - scare_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-scare_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: scare_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-scare_redis_pass}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    networks:
      - scare_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  scare_network:
    driver: bridge
